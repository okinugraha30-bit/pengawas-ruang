<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pengawas Ruangan - CBT</title>
    <!-- Library PubNub untuk Sinkronisasi Real-time -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.0.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #0f172a; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        select, input[type="text"], input[type="password"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        button:hover { background: #2563eb; }
        button.btn-logout { background: #ef4444; }
        button.btn-logout:hover { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f1f5f9; color: #475569; }
        .violation-badge { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        
        /* Overlay Halaman Login Pengawas Ruangan */
        #loginPengawasOverlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #0f172a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 99999; 
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); 
        }
        .login-box h3 { 
            margin-top: 0; 
            margin-bottom: 20px; 
            color: #0f172a; 
            text-align: center; 
        }
        .form-group { 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }
    </style>
</head>
<body>

    <!-- 1. FORM LOGIN PENGAWAS RUANGAN -->
    <div id="loginPengawasOverlay">
        <div class="login-box">
            <h3>Login Pengawas Ruangan</h3>
            <div class="form-group">
                <label>Username Pengawas:</label>
                <input type="text" id="loginPengawasUser" placeholder="Masukkan username pengawas">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="loginPengawasPass" placeholder="Masukkan password">
            </div>
            <button onclick="handlePengawasLogin()" style="width: 100%; margin-top: 10px;">Masuk Ruangan</button>
        </div>
    </div>

    <!-- 2. DASHBOARD UTAMA PENGAWAS RUANGAN (TERSEMBUNYI SEBELUM LOGIN) -->
    <div class="container" id="mainPengawasDashboard" style="display: none;">
        <div class="header-flex">
            <h2>Dashboard Pengawas Ruangan</h2>
            <button class="btn-logout" onclick="handlePengawasLogout()">Logout</button>
        </div>
        
        <!-- Toolbar & Filter Ruangan -->
        <div class="toolbar">
            <label for="filterRuanganPengawas"><b>Pilih Ruangan:</b></label>
            <select id="filterRuanganPengawas" onchange="filterRuanganPengawasChange()">
                <option value="ALL">Semua Ruangan</option>
                <option value="Ruang 1">Ruang 1</option>
                <option value="Ruang 2">Ruang 2</option>
            </select>
        </div>

        <!-- Tabel Monitoring Siswa & Log Pelanggaran Real-time -->
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Siswa</th>
                    <th>Ruangan</th>
                    <th>Status Login</th>
                    <th>Log Pelanggaran Real-time</th>
                </tr>
            </thead>
            <tbody id="pengawasTableBody">
                <!-- Data siswa Anda yang dimuat secara dinamis -->
                <tr>
                    <td>1</td>
                    <td>Contoh Siswa</td>
                    <td>Ruang 1</td>
                    <td>Online</td>
                    <td><span class="violation-badge" id="log-contoh-siswa">Belum ada pelanggaran</span></td>
                </tr>
            </tbody>
        </table>
    </div>

<script>
    let pubnubClient = null;

    // Cek Sesi Login Pengawas Saat Halaman Dimuat
    window.addEventListener('load', () => {
        if (localStorage.getItem('pengawas_logged_in') === 'true') {
            document.getElementById('loginPengawasOverlay').style.display = 'none';
            document.getElementById('mainPengawasDashboard').style.display = 'block';
            initPengawasPubNub();
        }
    });

    // Fungsi Autentikasi Login Pengawas
    function handlePengawasLogin() {
        let user = document.getElementById('loginPengawasUser').value;
        let pass = document.getElementById('loginPengawasPass').value;
        
        // Kredensial login pengawas ruangan
        if (user === "pengawas" && pass === "pengawas123") {
            localStorage.setItem('pengawas_logged_in', 'true');
            document.getElementById('loginPengawasOverlay').style.display = 'none';
            document.getElementById('mainPengawasDashboard').style.display = 'block';
            initPengawasPubNub();
        } else {
            alert("Username atau Password pengawas salah!");
        }
    }

    // Fungsi Logout Pengawas
    function handlePengawasLogout() {
        localStorage.removeItem('pengawas_logged_in');
        location.reload();
    }

    // Inisialisasi Koneksi PubNub Pengawas untuk Menerima Laporan Siswa
    function initPengawasPubNub() {
        pubnubClient = new PubNub({
            publishKey: "pub-c-5618932f-1208-4f99-81ed-334268b10f87",
            subscribeKey: "sub-c-a8bf0e07-65d5-4794-8564-7567ee20e659",
            uuid: "pengawas_ruangan_" + Math.random().toString(36).substring(2, 9)
        });

        pubnubClient.subscribe({ channels: ["cbt_monitoring_channel"] });
        
        pubnubClient.addListener({
            message: function(msg) {
                const data = msg.message;
                // Menerima laporan pelanggaran siswa secara real-time dan memperbarui tabel
                if (data && data.type === "VIOLATION") {
                    let logElement = document.getElementById('log-' + data.studentName.replace(/\s+/g, '-').toLowerCase());
                    if (logElement) {
                        logElement.innerText = `${data.reason} (Ke-${data.count}) pada ${data.timestamp}`;
                        logElement.style.background = "#fee2e2";
                    }
                }
            }
        });
    }

    // Fungsi Filter Ruangan Pengawas
    function filterRuanganPengawasChange() {
        let selectedRoom = document.getElementById('filterRuanganPengawas').value;
        console.log("Filter ruangan pengawas diubah ke: " + selectedRoom);
    }
</script>
</body>
</html>
